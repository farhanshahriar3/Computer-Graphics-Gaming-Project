[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-flow-simulator"
version = "0.1.0"
description = "A 3D traffic-flow simulator with a Model Context Protocol server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "PyOpenGL>=3.1.7", "PyOpenGL-accelerate>=3.1.7"]

[project.scripts]
traffic-mcp = "traffic_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]